spring.application.name=merchan_backend

# Importar .env de forma obligatoria desde la raíz
spring.config.import=file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Lanza excepcion si no hay controller para la ruta
spring.mvc.throw-exception-if-no-handler-found=true

# Evita que recursos estaticos absorban la peticion
spring.web.resources.add-mappings=false

# Habilitar api-docs y swagger-ui
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html